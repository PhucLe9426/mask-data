services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: masking-api
    restart: unless-stopped
    init: true
    environment:
      LOCAL_LLM_URL: ${LOCAL_LLM_URL:-http://192.168.210.212:8000/v1/chat/completions}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}
      PUBLIC_LLM_URL: ${PUBLIC_LLM_URL:-}
      PUBLIC_LLM_API_KEY: ${PUBLIC_LLM_API_KEY:-}
      PUBLIC_LLM_MODEL: ${PUBLIC_LLM_MODEL:-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-180}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      DATABASE_URL: postgresql://masking:masking_dev_password@postgres:5432/masking_app
      DATABASE_MIN_POOL_SIZE: ${DATABASE_MIN_POOL_SIZE:-1}
      DATABASE_MAX_POOL_SIZE: ${DATABASE_MAX_POOL_SIZE:-5}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-200000}
      LOCAL_LLM_CHUNK_CHARS: ${LOCAL_LLM_CHUNK_CHARS:-12000}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    container_name: masking-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: masking_app
      POSTGRES_USER: masking
      POSTGRES_PASSWORD: masking_dev_password
    ports:
      - "5434:5432"
    volumes:
      - masking_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U masking -d masking_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  masking_postgres_data:
